# Render Blueprint: free web service (app + API + admin + background updates) and free Postgres (PostGIS).
# Render → New → Blueprint → this repository → branch claude/fervent-maxwell-r7hhj0 → Apply.
# Free tier limits: the service sleeps after 15 min idle (~1 min to wake); the free database expires after 30 days.
services:
  - type: web
    name: passtra
    runtime: docker
    plan: free
    region: frankfurt
    branch: claude/fervent-maxwell-r7hhj0
    dockerfilePath: ./infra/Dockerfile
    dockerContext: .
    healthCheckPath: /v1/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: passtra-db
          property: connectionString
      - key: AUTH_JWT_SECRET
        generateValue: true
      - key: REPORT_SALT
        generateValue: true
      - key: RUN_WORKER
        value: "true"
      - key: TRUST_PROXY
        value: "true"
      - key: DATABASE_POOL_MAX
        value: "5"
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: GOOGLE_MAPS_API_KEY
        sync: false
      - key: TICKETMASTER_API_KEY
        sync: false
      # Admins: user ids, and/or e-mails (an e-mail counts only once it is confirmed).
      - key: ADMIN_USER_IDS
        sync: false
      - key: ADMIN_EMAILS
        sync: false
      # Public address used in shared links and link previews.
      - key: PUBLIC_WEB_URL
        value: https://passtra.onrender.com
      # Email codes (registration, email linking, password reset) — https://resend.com, verified sending domain.
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      # SMS codes for phone linking — Twilio.
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_FROM
        sync: false
      # Web Push (VAPID). If unset, a key pair is generated and stored in the database on first use;
      # set them explicitly so browser subscriptions survive a database re-creation.
      - key: WEB_PUSH_PUBLIC_KEY
        sync: false
      - key: WEB_PUSH_PRIVATE_KEY
        sync: false
      # Universal Links / App Links for the store apps.
      - key: APPLE_TEAM_ID
        sync: false
      - key: ANDROID_CERT_SHA256
        sync: false
databases:
  - name: passtra-db
    plan: free
    region: frankfurt
    databaseName: passtra
    user: passtra
    postgresMajorVersion: "17"
